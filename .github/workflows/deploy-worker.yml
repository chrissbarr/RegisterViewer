name: Deploy Worker

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy-worker:
    needs: ci
    runs-on: ubuntu-latest
    concurrency:
      group: worker-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        working-directory: worker
        run: npm ci
      - name: Inject KV namespace IDs
        working-directory: worker
        run: |
          sed -i "s|<production-namespace-id>|${{ vars.KV_NAMESPACE_ID }}|" wrangler.toml
          sed -i "s|<preview-namespace-id>|${{ vars.KV_PREVIEW_NAMESPACE_ID }}|" wrangler.toml
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: worker
