name: CI

on:
  pull_request:
    branches: [master]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=high --omit=dev
      - name: Lint
        run: npm run lint
      - name: Dead code check (knip)
        run: npm run knip
        continue-on-error: true
      - name: Unit tests
        run: npm test
      - name: Build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run build
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist
          retention-days: 1
      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
      - name: E2E tests
        run: npm run test:e2e

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        working-directory: worker
        run: npm ci
      - name: Audit dependencies
        working-directory: worker
        run: npm audit --audit-level=high --omit=dev
      - name: Lint
        working-directory: worker
        run: npm run lint
      - name: Type check
        working-directory: worker
        run: npx tsc --noEmit
      - name: Dead code check (knip)
        working-directory: worker
        run: npm run knip
        continue-on-error: true
      - name: Run tests
        working-directory: worker
        run: npm test
