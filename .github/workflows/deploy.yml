name: Deploy to cPanel

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    concurrency:
      group: cpanel-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - name: Assemble deploy payload
        run: |
          mkdir -p deploy/api/src/handlers deploy/api/database/migrations
          cp -R dist/* deploy/
          cp -R api/src/* deploy/api/src/
          cp -R api/database/* deploy/api/database/
          cp api/index.php deploy/api/
          cp api/config.php deploy/api/
          cp api/.htaccess deploy/api/

      - name: Deploy via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./deploy/
          server-dir: ./
          dangerous-clean-slate: false

      - name: Post-deploy smoke test
        run: |
          sleep 15
          echo "Checking frontend..."
          curl -sf --retry 3 --retry-delay 5 ${{ vars.VITE_API_URL }}/ > /dev/null
          echo "Frontend OK"
          echo "Checking API health..."
          curl -sf --retry 3 --retry-delay 5 ${{ vars.VITE_API_URL }}/api/health
          echo ""
          echo "API OK"
