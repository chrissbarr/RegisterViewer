name: Deploy to cPanel

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    concurrency:
      group: cpanel-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2

      - run: npm ci
        working-directory: frontend

      - run: npm run build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - name: Install PHP runtime dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
        working-directory: api

      - name: Assemble deploy payload
        run: |
          mkdir -p deploy/api/src/handlers deploy/api/database/migrations deploy/api/vendor
          cp -R frontend/dist/* deploy/
          cp -R api/src/* deploy/api/src/
          cp -R api/database/* deploy/api/database/
          cp -R api/vendor/* deploy/api/vendor/
          cp api/index.php deploy/api/
          cp api/config.php deploy/api/
          cp api/.htaccess deploy/api/

      - name: Deploy via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./deploy/
          server-dir: ./
          dangerous-clean-slate: false

      - name: Post-deploy smoke test
        run: |
          sleep 15
          echo "Checking frontend..."
          curl -sf --retry 3 --retry-delay 5 ${{ vars.VITE_API_URL }}/ > /dev/null
          echo "Frontend OK"
          echo "Checking API health..."
          curl -sf --retry 3 --retry-delay 5 ${{ vars.VITE_API_URL }}/api/health
          echo ""
          echo "API OK"
