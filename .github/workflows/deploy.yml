name: Deploy to cPanel

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    concurrency:
      group: cpanel-deploy
      cancel-in-progress: false
    steps:
      - name: Deploy via cPanel API
        uses: pinkasey/cpanel-deploy-action@b61fa4690c5c978610c131b26a6705273365b368 # v1.2.3
        with:
          hostname: ${{ secrets.CPANEL_HOSTNAME }}
          cpanel_username: ${{ secrets.CPANEL_USERNAME }}
          cpanel_token: ${{ secrets.CPANEL_TOKEN }}
          repository_root: ${{ vars.CPANEL_REPO_PATH }}
          branch: master
          updateRepository: true
