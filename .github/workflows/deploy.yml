name: Deploy to cPanel

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    concurrency:
      group: cpanel-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          VITE_API_URL: /api

      - name: Assemble deploy payload
        run: |
          mkdir -p deploy/api/src/handlers deploy/api/database/migrations
          cp -R dist/* deploy/
          cp -R api/src/* deploy/api/src/
          cp -R api/database/* deploy/api/database/
          cp api/index.php deploy/api/
          cp api/config.php deploy/api/
          cp api/.htaccess deploy/api/

      - name: Deploy via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./deploy/
          server-dir: /subdomains/registerviewer/
          dangerous-clean-slate: false
